name: Deploy to GitHub Pages

# Build the Vite site and publish dist/ to GitHub Pages.
# Requires: repo Settings -> Pages -> "Build and deployment" -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token that can publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run finish; don't cancel an in-flight deploy mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
